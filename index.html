    />

    <meta property="og:type" content="website" />

      content="Robin Roy — Full-stack engineer, Sharjah UAE"

    />
    <meta property="og:image" content="https://robinroy.dev/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/inter-tight-600.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="image"
      type="image/avif"
      href="/images/portrait-880.avif"
      fetchpriority="high"
    />

    <style>
      @font-face {
        font-family: "Inter Tight";
        src: url("/fonts/inter-tight-400.woff2") format("woff2");
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: "Inter Tight";
        src: url("/fonts/inter-tight-500.woff2") format("woff2");
        font-weight: 500;
        font-display: swap;
      }
      @font-face {
        font-family: "Inter Tight";
        src: url("/fonts/inter-tight-600.woff2") format("woff2");
        font-weight: 600;
        font-display: swap;
      }
    </style>

    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          document.documentElement.dataset.theme =
            stored === "light" || stored === "dark"
              ? stored
              : prefersDark
                ? "dark"
                : "light";
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
